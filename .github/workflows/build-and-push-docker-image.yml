name: Build and Push Docker Image

on:
  push:
    branches:
      - main # mainブランチにプッシュされたときにこのワークフローを実行

jobs:
  build-and-push:
    runs-on: ubuntu-latest # ワークフローを実行する仮想環境

    steps:
    - name: Checkout repository # GitHubリポジトリのコードを仮想環境にチェックアウト
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry # GitHub Packages (ghcr.io) にログイン
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }} # 現在のGitHubユーザー名
        password: ${{ secrets.GITHUB_TOKEN }} # GitHub Actionsに組み込まれた自動生成されるトークン

    - name: Build and push Docker image # Dockerイメージをビルドしてプッシュ
      uses: docker/build-push-action@v5
      with:
        context: . # Dockerfileがある場所（リポジトリのルート）
        push: true # ビルド後にプッシュを実行
        tags: ghcr.io/${{ github.repository }}:latest # イメージのタグを定義 (例: ghcr.io/your-github-username/your-repo-name:latest)